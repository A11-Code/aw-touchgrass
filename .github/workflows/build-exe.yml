name: Build Executable

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.exe'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone repository
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch main "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" .

      - name: Install dependencies
        shell: pwsh
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller ratiobot.spec --noconfirm
          if (Test-Path "dist\aw-touchgrass.exe") {
            Move-Item -Path "dist\aw-touchgrass.exe" -Destination "aw-touchgrass.exe" -Force
          }

      - name: Commit and push executable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aw-touchgrass.exe
          $changes = git status --porcelain aw-touchgrass.exe
          if ($changes) {
            git commit -m "Automated build: update aw-touchgrass.exe [skip ci]"
            git push "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" main
          } else {
            Write-Host "No changes detected in aw-touchgrass.exe"
          }
