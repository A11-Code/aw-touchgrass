name: Build Executable

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.exe'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller ratiobot.spec --noconfirm
          if (Test-Path "dist\aw-touchgrass.exe") {
            Move-Item -Path "dist\aw-touchgrass.exe" -Destination "aw-touchgrass.exe" -Force
          }

      - name: Commit and push executable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add aw-touchgrass.exe
          $changes = git status --porcelain aw-touchgrass.exe
          if ($changes) {
            git commit -m "Automated build: update aw-touchgrass.exe [skip ci]"
            git push
          } else {
            Write-Host "No changes detected in aw-touchgrass.exe"
          }
